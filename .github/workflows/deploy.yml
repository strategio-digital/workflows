name: deploy

on:
  workflow_call:
    inputs:
      version:
        description: Commit whose image and compose to deploy; empty deploys the commit of the run
        type: string
        default: ""
      compose:
        description: Compose file of the stack
        type: string
        default: docker/production/compose.yaml
      stack:
        description: Swarm stack; empty takes the repository name
        type: string
        default: ""
      role:
        description: Value of node.labels.role the services run on, passed to the compose as ROLE
        type: string
        default: app

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, ops-1]
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}

      - shell: python3 -u {0}
        env:
          REPO_SECRETS: ${{ toJSON(secrets) }}
          REPO_VARS: ${{ toJSON(vars) }}
          VERSION: ${{ inputs.version || github.sha }}
          STACK: ${{ inputs.stack || github.event.repository.name }}
          ROLE: ${{ inputs.role }}
          COMPOSE: ${{ inputs.compose }}
        run: |
          import hashlib, json, os, re, subprocess, sys, time
          from datetime import datetime, timezone

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          stack = os.environ["STACK"].lower()
          version = os.environ["VERSION"]
          image = f"registry.strategio.dev/{os.environ['GITHUB_REPOSITORY'].lower()}:{version}"

          repository = os.environ["GITHUB_REPOSITORY"]
          env = dict(os.environ)
          secret_values = {}
          for source in ("REPO_VARS", "REPO_SECRETS"):
              values = json.loads(env.pop(source) or "{}") or {}
              values.pop("github_token", None)
              values = {key: str(value) for key, value in values.items()}
              if source == "REPO_SECRETS":
                  secret_values = values
              env.update(values)
          env.update(STACK=stack, VERSION=version, IMAGE=image)

          def docker(*args, stdin=None):
              return subprocess.run(["docker", *args], input=stdin, capture_output=True, text=True)

          for line in docker("service", "ls", "--filter", f"label=com.docker.stack.namespace={stack}", "--format", "{{.Name}}").stdout.split():
              owner = docker("service", "inspect", "--format", '{{index .Spec.Labels "com.strategio.repository"}}', line).stdout.strip()
              if owner not in ("", "<no value>") and owner != repository:
                  fail(f"stack {stack} belongs to {owner}; choose another stack name")

          if subprocess.run(["docker", "manifest", "inspect", image], capture_output=True).returncode != 0:
              fail(f"{image} is not in the registry; build the commit first")

          rendered = subprocess.run(
              ["docker", "stack", "config", "--compose-file", env["COMPOSE"]],
              env=env, capture_output=True, text=True,
          )
          if rendered.returncode != 0:
              fail(f"docker stack config failed: {rendered.stderr.strip()}")
          converted = subprocess.run(["yq", "-o=json"], input=rendered.stdout, capture_output=True, text=True)
          if converted.returncode != 0:
              fail("yq could not read the rendered compose")
          compose = json.loads(converted.stdout)
          del rendered, converted

          errors = []
          prefix = f"{stack}_"
          overlay = {"driver": "overlay", "driver_opts": {"com.docker.network.driver.mtu": "1400"}}

          for name, volume in (compose.get("volumes") or {}).items():
              volume = volume or {}
              if volume.get("external"):
                  errors.append(f"volume {name} is external")
              if "name" in volume and not str(volume["name"]).startswith(prefix):
                  errors.append(f"volume {name} has a name outside {prefix}")

          networks = compose.setdefault("networks", {})
          for name, network in list(networks.items()):
              network = network or {}
              if network.get("external"):
                  if network.get("name", name) != "edge":
                      errors.append(f"network {name} is external; only edge is allowed")
                  continue
              if "name" in network and not str(network["name"]).startswith(prefix):
                  errors.append(f"network {name} has a name outside {prefix}")
              network.setdefault("driver", "overlay")
              network.setdefault("driver_opts", {}).setdefault("com.docker.network.driver.mtu", "1400")
              networks[name] = network

          for name, service in (compose.get("services") or {}).items():
              if "network_mode" in service:
                  errors.append(f"service {name} sets network_mode")
              for mount in service.get("volumes") or []:
                  if mount.get("type") not in ("volume", "tmpfs"):
                      errors.append(f"service {name} mounts {mount.get('type')} at {mount.get('target')}")
              if not service.get("networks"):
                  service["networks"] = {"default": None}
                  networks.setdefault("default", dict(overlay))

          existing = set(docker("secret", "ls", "--format", "{{.Name}}").stdout.split())

          def latest(base):
              versions = [name for name in existing if re.fullmatch(rf"{base}-v\d+", name)]
              return max(versions, key=lambda name: int(name.rsplit("-v", 1)[1]), default=None)

          backup_secrets = {
              "PGBACKREST_REPO1_S3_KEY": "shared-r2-backups-access-key-id",
              "PGBACKREST_REPO1_S3_KEY_SECRET": "shared-r2-backups-secret-access-key",
              "PGBACKREST_REPO1_CIPHER_PASS": "shared-backups-cipher-pass",
          }
          for name, service in (compose.get("services") or {}).items():
              labels = (service.get("deploy") or {}).get("labels") or {}
              if isinstance(labels, list):
                  labels = dict(label.split("=", 1) for label in labels)
              if labels.get("backup") != "pgbackrest":
                  continue
              environment = service.get("environment") or {}
              if isinstance(environment, list):
                  environment = dict(item.split("=", 1) for item in environment)
              environment["PGBACKREST_REPO1_PATH"] = f"/{stack}/{name}"
              service["environment"] = environment
              mounts = [mount for mount in service.get("secrets") or [] if mount.get("target") not in backup_secrets]
              for target, base in backup_secrets.items():
                  secret = latest(base)
                  if secret is None:
                      errors.append(f"service {name} wants backups, but the secret {base}-v<n> does not exist")
                      continue
                  compose.setdefault("secrets", {})[base] = {"external": True, "name": secret}
                  mounts.append({"source": base, "target": target})
              service["secrets"] = mounts
          migrated = False
          dropped = set()
          for name, item in list((compose.get("secrets") or {}).items()):
              source = item.pop("x-environment", None)
              optional = item.pop("x-optional", False)
              if source is None:
                  continue
              migrated = True
              value = env.get(source)
              if not value and optional:
                  del compose["secrets"][name]
                  dropped.add(name)
                  continue
              if not value:
                  errors.append(f"secret {name} wants {source}, which is not a repository secret")
                  continue
              secret = f"{prefix}{name}-{hashlib.sha256(value.encode()).hexdigest()[:12]}"
              if secret not in existing:
                  created = docker("secret", "create", "--label", f"com.strategio.repository={repository}", secret, "-", stdin=value)
                  if created.returncode != 0:
                      errors.append(f"secret {name} could not be created: {created.stderr.strip()}")
                      continue
              compose["secrets"][name] = {"external": True, "name": secret}

          for service in (compose.get("services") or {}).values():
              if service.get("secrets"):
                  service["secrets"] = [mount for mount in service["secrets"] if mount.get("source") not in dropped]

          for kind in ("configs", "secrets"):
              for name, item in (compose.get(kind) or {}).items():
                  if item.get("external"):
                      shared = kind == "secrets" and str(item.get("name", name)).startswith("shared-")
                      generated = kind == "secrets" and str(item.get("name", "")).startswith(prefix)
                      if not (shared or generated):
                          errors.append(f"{kind[:-1]} {name} is external; only shared- secrets are allowed")
                      continue
                  if "name" in item:
                      if not str(item["name"]).startswith(prefix):
                          errors.append(f"{kind[:-1]} {name} has a name outside {prefix}")
                      continue
                  if "file" not in item:
                      errors.append(f"{kind[:-1]} {name} has no file")
                      continue
                  with open(item["file"], "rb") as handle:
                      digest = hashlib.sha256(handle.read()).hexdigest()[:12]
                  item["name"] = f"{prefix}{name}-{digest}"

          for name, service in (compose.get("services") or {}).items():
              deploy = service.setdefault("deploy", {})
              labels = deploy.get("labels") or {}
              if isinstance(labels, list):
                  labels = dict(label.split("=", 1) for label in labels)
              labels["com.strategio.repository"] = repository
              deploy["labels"] = labels

          rendered_json = json.dumps(compose)
          leaked = sorted(key for key, value in secret_values.items() if len(value) >= 8 and value in rendered_json)
          del rendered_json
          for key in leaked:
              if migrated:
                  errors.append(f"the value of {key} ends up in the service spec; pass it through x-environment instead")
              else:
                  print(f"::warning::the value of {key} ends up in the service spec; move it to a secret with x-environment")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          started = time.time()
          deployed = subprocess.run(
              ["docker", "stack", "deploy", "--detach=false", "--prune", "--with-registry-auth",
               "--compose-file", "-", stack],
              input=json.dumps(compose).replace("$", "$$"), env=env, text=True,
          )
          del compose

          services = subprocess.run(
              ["docker", "service", "ls", "--filter", f"label=com.docker.stack.namespace={stack}",
               "--format", "{{.Name}}\t{{.Replicas}}"],
              capture_output=True, text=True, check=True,
          ).stdout.splitlines()

          summary = [f"Deployed `{image}` as stack `{stack}`.", "", "| Service | Replicas | Update |", "| --- | --- | --- |"]
          broken = deployed.returncode != 0
          for line in services:
              service, replicas = line.split("\t")
              status = json.loads(subprocess.run(
                  ["docker", "service", "inspect", "--format", "{{json .UpdateStatus}}", service],
                  capture_output=True, text=True, check=True,
              ).stdout or "null") or {}
              state = status.get("State", "")
              begun = status.get("StartedAt", "")[:19]
              fresh = bool(state and begun) and datetime.fromisoformat(begun).replace(tzinfo=timezone.utc).timestamp() >= started - 5
              if fresh and state in ("rollback_started", "rollback_paused", "rollback_completed", "paused"):
                  broken = True
                  print(f"::error::{service}: {state} ({status.get('Message', '')})")
              running, desired = replicas.split(" ")[0].split("/")
              if running != desired:
                  broken = True
                  print(f"::error::{service} runs {running} of {desired} replicas")
              summary.append(f"| {service} | {replicas} | {state if fresh else 'unchanged'} |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("\n".join(summary) + "\n")

          if broken:
              fail("the deploy did not converge; Swarm keeps or restored the previous version")
