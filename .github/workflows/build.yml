name: build

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Dockerfile of the image
        type: string
        default: docker/production/Dockerfile
      context:
        description: Build context
        type: string
        default: .
    outputs:
      image:
        description: The pushed image
        value: ${{ jobs.build.outputs.image }}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, ops-1]
    concurrency:
      group: build-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: build
        shell: python3 -u {0}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          REPO_SECRETS: ${{ toJSON(secrets) }}
          REPO_VARS: ${{ toJSON(vars) }}
        run: |
          import json, os, re, subprocess, sys

          env = dict(os.environ)
          repo_vars = json.loads(env.pop("REPO_VARS") or "{}") or {}
          repo_secrets = json.loads(env.pop("REPO_SECRETS") or "{}") or {}
          repo_secrets.pop("github_token", None)

          with open(env["DOCKERFILE"]) as dockerfile:
              text = dockerfile.read()

          args = set()
          for line in re.findall(r"(?im)^[ \t]*ARG[ \t]+(.+)$", text):
              args.update(token.split("=", 1)[0] for token in line.split())

          ids = set()
          for mount in re.findall(r"--mount=(\S+)", text):
              options = dict(option.split("=", 1) for option in mount.split(",") if "=" in option)
              if options.get("type") == "secret" and "id" in options:
                  ids.add(options["id"])

          build_args = sorted(name for name in args if name in repo_vars)
          build_secrets = sorted(ids & repo_secrets.keys())
          flags = [f"--build-arg={name}={repo_vars[name]}" for name in build_args]
          for index, name in enumerate(build_secrets):
              env[f"BUILD_SECRET_{index}"] = str(repo_secrets[name])
              flags.append(f"--secret=id={name},env=BUILD_SECRET_{index}")

          if subprocess.run(["docker", "buildx", "inspect", "limited"], capture_output=True).returncode != 0:
              subprocess.run(
                  ["docker", "buildx", "create", "--name", "limited", "--driver", "docker-container",
                   "--driver-opt", "memory=5g,memory-swap=5g,cpu-period=100000,cpu-quota=300000,restart-policy=unless-stopped"],
                  check=True, stdout=subprocess.DEVNULL,
              )

          image = f"registry.strategio.dev/{env['GITHUB_REPOSITORY'].lower()}:{env['GITHUB_SHA']}"
          source = f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}"
          built = subprocess.run(
              ["docker", "buildx", "build", "--builder", "limited", "--pull", "--push",
               "--file", env["DOCKERFILE"],
               "--label", f"org.opencontainers.image.source={source}",
               "--label", f"org.opencontainers.image.revision={env['GITHUB_SHA']}",
               "--tag", image, *flags, env["CONTEXT"]],
              env=env,
          )
          if built.returncode != 0:
              sys.exit(built.returncode)

          with open(env["GITHUB_OUTPUT"], "a") as output:
              output.write(f"image={image}\n")
          with open(env["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Built and pushed `{image}`.\n")
              if build_args or build_secrets:
                  names = ", ".join(f"`{name}`" for name in build_args + build_secrets)
                  summary.write(f"\nPassed to the build: {names}.\n")

      - if: always()
        run: docker buildx prune --builder limited --force --filter until=168h --max-used-space 20GB >/dev/null
